{# The nav bar's status, fetched by both base.html and the shell. A dot or icon and a word.
   base.html does not load components.css, so the legacy bar's rules travel with the badge. #}
{% import 'partials/roof_parts.html' as parts %}
<style>
  .ssc-topbar__status { flex-wrap: wrap; justify-content: flex-end; gap: var(--ssc-space-1) var(--ssc-space-4); color: var(--ssc-text-1); }
  .ssc-topbar__status .ssc-status { display: inline-flex; align-items: center; gap: var(--ssc-space-2); font-size: var(--ssc-text-footnote); font-weight: var(--ssc-weight-strong); white-space: nowrap; }
  .ssc-topbar__status .ssc-status__dot { width: 8px; height: 8px; border-radius: var(--ssc-radius-full); background: currentColor; }
  .ssc-topbar__status .ssc-status[data-tone="ok"] { color: var(--ssc-green); }
  .ssc-topbar__status .ssc-status[data-tone="attention"] { color: var(--ssc-orange); }
  .ssc-topbar__status .ssc-status[data-tone="danger"] { color: var(--ssc-red); }
</style>
{{ parts.roof_lines(roof_lines) }}
