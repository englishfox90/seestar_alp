{% if status.loop_stale %}
  <span class="badge text-bg-danger">Roof: loop stopped</span>
{% elif status.alarm %}
  <span class="badge text-bg-danger">Roof: alarm</span>
{% elif status.safe %}
  <span class="badge text-bg-success">Roof: safe</span>
{% else %}
  <span class="badge text-bg-danger">Roof: unsafe</span>
{% endif %}
{% if not status.loop_stale and not status.connected %}<span class="badge text-bg-warning">scope offline</span>{% endif %}
{% if status.dry_run %}<span class="badge text-bg-warning">dry run</span>{% endif %}
