<section class="live-group">
  <h2 class="live-section-title">View</h2>
  <div class="live-side-card">

            id="liveRotateButton"
            class="btn btn-outline-secondary live-action live-rotate-btn"
            aria-label="Rotate live view"
            title="Rotate live view 90 degrees"
            onclick="rotateLiveView()">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 7.083.5.5 0 1 1 .908.418A6 6 0 1 1 8 2V.5a.5.5 0 0 1 .854-.354l2 2a.5.5 0 0 1 0 .708l-2 2A.5.5 0 0 1 8 4.5z"/>
      </svg>
      <span>Rotate view</span>
    </button>
  </div>
</section>
