<section class="live-group">
  <h2 class="live-section-title">Wide camera</h2>
  <div class="live-side-card">
    <div class="form-check form-switch live-switch">
      <label class="form-check-label" for="wide-cam-toggle">
        Use wide camera <span class="live-tag">Experimental</span>
      </label>
      <input class="form-check-input" type="checkbox" role="switch"
             id="wide-cam-toggle"
             {% if wide_cam %}checked{% endif %}
             hx-post="{{ root }}/live/wide-cam"
             hx-trigger="change"
             hx-target="#wide-cam-control"
             hx-swap="innerHTML"
             hx-vals='js:{"wide_cam": document.getElementById("wide-cam-toggle").checked.toString()}'>
    </div>
  </div>
</section>
