<section class="live-group">
  <h2 class="live-section-title">Zoom</h2>
  <div class="live-side-card">
    <div class="live-segmented" role="group" aria-label="Zoom">
      <input type="radio" class="btn-check" name="zoom" id="zoom1x" autocomplete="off"
             hx-post="{{ root }}/live/zoom"
             hx-vals='{"zoom": 0}'
             hx-swap="none">
      <label class="btn btn-outline-secondary" for="zoom1x">1x</label>
      <input type="radio" class="btn-check" name="zoom" id="zoom2x" autocomplete="off"
             hx-post="{{ root }}/live/zoom"
             hx-vals='{"zoom": 1}'
             hx-swap="none">
      <label class="btn btn-outline-secondary" for="zoom2x">2x</label>
      <input type="radio" class="btn-check" name="zoom" id="zoom4x" autocomplete="off"
             hx-post="{{ root }}/live/zoom"
             hx-vals='{"zoom": 2}'
             hx-swap="none">
      <label class="btn btn-outline-secondary" for="zoom4x">4x</label>
    </div>
  </div>
</section>
