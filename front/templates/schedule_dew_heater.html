{% extends 'schedule_base.html' %}

{% block schedule_tab_content %}
  <div>
    <div class="d-flex justify-content-between align-items-baseline">
      <div id="dewHeaterHelp" class="form-label">Dew heater (0 = off)</div>
      <label for="dewHeaterValue" id="rangeValue">90</label>
    </div>
    <input type="range" min="0" max="100" value="90" class="slider form-range" name="dewHeaterValue" id="dewHeaterValue" oninput="rangeValue.innerText = this.value">
  </div>
{% endblock %}
