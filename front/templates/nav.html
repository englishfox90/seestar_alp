{# Legacy pages use the same nav as the shell. nav.css styles it on both. #}
{% include 'ssc/nav.html' %}

<script>
    // isn't ChatGPT wonderful, if you have a better way to do this, feel free
    // JavaScript to set active class
    document.addEventListener("DOMContentLoaded", function () {
      // Get all nav-link elements, which pages still use for their own tabs
      const navLinks = document.querySelectorAll('.nav-link');

      // Get the current URL path
      const currentPath = window.location.pathname;

      // Set active class for the current page link
      navLinks.forEach(link => {
        if (link.getAttribute('href') === currentPath) {
          link.classList.add('active'); // Add 'active' to the current page link
        }
      });
    });
</script>
